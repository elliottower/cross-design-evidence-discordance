claims:
  familial-confounding-abstract:
    quotes:
    - exact: 'Estimates from Mendelian randomization studies of unrelated individuals can be biased due

        to uncontrolled confounding from familial effects.'
      section: Abstract
      page: 1
  stratification-dynastic-assortative:
    quotes:
    - exact: 'However, environmental and social factors such as assortative

        mating, dynastic effects, and population structure may affect the

        distribution of genetic variants for specific traits within populations'
      section: Introduction
      page: 2
  spurious-association-confounding:
    quotes:
    - exact: 'The commonality amongst all three processes is that they

        induce a spurious association between the instrumenting variant

        and the outcome through confounding.'
      section: Introduction
      page: 2
  population-stratification-confounding:
    quotes:
    - exact: Confounding by population stratification1, in which ancestry is correlated with both phenotypes
        and genotypes, was a major concern
