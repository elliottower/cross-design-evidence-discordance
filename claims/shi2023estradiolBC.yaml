claims:
  estrogen-bc-gen:
    quotes:
    - exact: 'We found that a standard deviation (SD) increase in TT, BT and estradiol increased the risk
        of overall BC (OR

        1.14, 95% CI 1.09–1.21, OR 1.19, 95% CI 1.07–1.33 and OR 1.03, 95% CI 1.01–1.06, respectively)'
      section: 'Abstract: Results'
      page: 1
  estrogen-bc-gen-results:
    quotes:
    - exact: 'We found two SNPs at P ≤ 5 × ­10–7 to proxy for an SD

        increase in estradiol, which explained 0.64% of the variance with an F statistic of 8.40. Although
        the F statistic

        is low, one of the SNPs (rs2414098) is an intronic variant in the gene CYP19A1 [56] which encodes
        the enzyme

        involved in the conversion of testosterone to estradiol

        [37]. For this reason, we continued with the MR analysis

        and found an increased risk of both overall BC risk and

        ER + BC (OR 1.03, 95% CI 1.01–1.06 and OR 1.06, 95%

        CI 1.03–1.09, respectively)'
      section: Results
      page: 6
