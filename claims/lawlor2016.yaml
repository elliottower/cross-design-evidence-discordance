claims:
  triangulation-definition:
    quotes:
    - exact: Triangulation is the practice of obtaining more reliable answers to research questions through
        integrating results from several different approaches, where each approach has different key sources
        of potential bias that are unrelated to each other.
      section: Abstract
      page: 1
  triangulation-convergence:
    quotes:
    - exact: if the results of different approaches all point to the same conclusion, this strengthens
        confidence in the finding.
      section: Abstract
      page: 1
  triangulation-qualitative:
    quotes:
    - exact: currently triangulation will mostly provide a qualitative assessment of the strength of evidence
        regarding causality.
      section: Key messages
      page: 2
  triangulation-definition-body:
    quotes:
    - exact: The practice of strengthening causal inferences by integrating results from several different
        approaches, where
      section: 'Triangulation: definition'
      page: 2
    - exact: each approach has different (and assumed to be largely unrelated) key sources of potential bias.
      section: 'Triangulation: definition'
      page: 3
  triangulation-criterion-unrelated-bias:
    quotes:
    - exact: Results from at least two, but ideally more, different approaches, with differing and unrelated
        key sources of potential biases, are compared.
      section: Criteria for triangulation in aetiological epidemiology
      page: 3
