    quotes:
    - exact: The annualized rate of asthma exacerbations was 0.93 (95% confidence interval [CI], 0.80
        to 1.07) with tezepelumab and 2.10 (95% CI, 1.84 to 2.39) with placebo (rate ratio, 0.44; 95%
        CI, 0.37 to 0.53; P<0.001).
      section: 'Abstract: Results'
