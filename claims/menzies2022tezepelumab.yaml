  tslp-asthma-conclusion:
    quotes:
    - exact: Patients with severe, uncontrolled asthma who received tezepelumab had fewer exacerbations
        and better lung function, asthma control, and health-related quality of life than those who received
        placebo.
      section: 'Abstract: Conclusions'
      page: 1
