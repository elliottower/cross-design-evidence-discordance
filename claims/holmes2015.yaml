claims:
  ldl-gen:
    quotes:
    - exact: 'a 1 mmol/L genetically instrumented increment in LDL-C gave an OR for CHD of 1.78 (95% CI:
        1.58, 2.01) for the unrestricted, and 1.92 (95% CI: 1.68, 2.19) for the restricted allele score
        (Figure 2).'
      section: Results
      page: 6
  triglycerides-gen:
    quotes:
    - exact: 'For triglycerides, a genetically instrumented 1 log-unit increment in triglycerides yielded
        similar estimates for CHD events: an OR of 1.62 (95% CI: 1.24, 2.11) for the unrestricted score'
      section: Results
      page: 6
  triglycerides-gen-abstract:
    quotes:
    - exact: 'For triglycerides, the unrestricted allele score (67 SNPs) and the restricted allele score
        (27 SNPs) were both associated with CHD (OR: 1.62; 95% CI: 1.24, 2.11 and 1.61; 95% CI: 1.00,
        2.59, respectively) per 1-log unit increment.'
      section: 'Abstract: Methods and results'
      page: 2
