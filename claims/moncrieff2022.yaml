claims:
  serotonin-hypothesis-no-consistent-support:
    quotes:
    - exact: 'The main areas of serotonin research

        provide no consistent evidence of there being an association between serotonin and depression,
        and no support for the hypothesis

        that depression is caused by lowered serotonin activity or concentrations.'
      section: Abstract
      page: 1
  serotonin-plasma-null:
    quotes:
    - exact: 'One meta-analysis of cohort studies of plasma serotonin showed no relationship with depression,

        and evidence that lowered serotonin concentration was associated with antidepressant use (n =
        1869).'
      section: Abstract
      page: 1
  serotonin-sert-gene-null:
    quotes:
    - exact: 'The two largest and highest quality studies of the SERT

        gene, one genetic association study (n = 115,257) and one collaborative meta-analysis (n = 43,165),
        revealed no evidence of an

        association with depression, or of an interaction between genotype, stress and depression.'
      section: Abstract
      page: 1
