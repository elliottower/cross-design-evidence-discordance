claims:
  uric-acid-obs:
    quotes:
    - exact: In the meta-analysis of 17 prospective observational studies (166 486 individuals; 9784 coronary
        heart disease events) a 1 SD higher urate concentration was associated with an odds ratio (OR)
        for coronary heart disease of 1·07 (95% CI 1·04–1·10).
      section: 'Summary: Findings'
      page: 1
  uric-acid-gen:
    quotes:
    - exact: The corresponding OR estimates from the conventional, multivariable adjusted, and Egger Mendelian
        randomisation analysis (58 studies; 198 598 individuals; 65 877 events) were 1·18 (95% CI 1·08–1·29),
        1·10 (1·00–1·22), and 1·05 (0·92–1·20), respectively, per 1 SD increment in plasma urate.
      section: 'Summary: Findings'
      page: 1
