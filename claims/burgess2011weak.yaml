claims:
  weak-instrument-bias-direction:
    quotes:
    - exact: "Estimates of association from IV analysis are \nbiased in the direction of the confounded,\
        \ observational association between \nphenotype and outcome. The magnitude of the bias depends\
        \ on the F-statistic for \nthe strength of relationship between IVs and phenotype."
      section: 'Abstract: Background'
  weak-instrument-bias-f-statistic:
    quotes:
    - exact: Bias is shown to increase as the expected F-statistic decreases
      section: 'Abstract: Results'
  weak-instrument-f10-misleading:
    quotes:
    - exact: "the commonly cited rule of thumb that F > 10 avoids bias in IV \nanalysis is misleading."
      section: 'Abstract: Conclusions'
