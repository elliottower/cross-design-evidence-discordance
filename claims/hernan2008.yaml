claims:
  nhs-emulated-whi:
    quotes:
    - exact: Using data from the observational Nurses’ Health Study, we emulated the design and intention-to-treat
        (ITT) analysis of the randomized trial.
      section: 'Abstract: Methods'
      page: 1
  itt-similar-to-whi:
    quotes:
    - exact: These ITT estimates are similar to those from the Women’s Health Initiative.
      section: 'Abstract: Results'
      page: 1
  discrepancy-explanation:
    quotes:
    - exact: Our findings suggest that the discrepancies between the Women’s Health Initiative and Nurses’
        Health Study ITT estimates could be largely explained by differences in the distribution of time
        since menopause and length of follow-up.
      section: 'Abstract: Conclusions'
      page: 1
  new-users-design:
    quotes:
    - exact: The approach we present here and elsewhere10,25 generalizes Ray’s “new-users design” to the
        case of time-varying treatments.
      section: Discussion
      page: 9
